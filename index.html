<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffe6f0;
        position: relative;
    }

    /* Pastel floating hearts */
    .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        opacity: 0.7;
        transform: rotate(45deg);
        animation: float 6s linear infinite;
    }
    .heart::before,
    .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
    }
    .heart::before { top: -10px; left: 0; }
    .heart::after { left: 10px; top: 0; }

    @keyframes float {
        0% { transform: translateY(100vh) rotate(45deg); }
        100% { transform: translateY(-100vh) rotate(45deg); }
    }

    /* Container */
    .container {
        text-align: center;
        position: relative;
        z-index: 10;
    }

    .envelope-text {
        font-weight: bold;
        color: #d14f6c;
        margin-bottom: 20px;
        font-size: 20px;
    }

    /* Cute pastel envelope */
    .envelope {
        width: 220px;
        height: 150px;
        background: #ffd6e8;
        position: relative;
        margin: auto;
        cursor: pointer;
        border-radius: 10px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        transition: transform 0.5s;
    }

    .envelope::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        border-left: 110px solid transparent;
        border-right: 110px solid transparent;
        border-bottom: 70px solid #ffb6c1;
        border-radius: 10px 10px 0 0;
    }

    .letter {
        width: 250px;
        height: 200px;
        background: #fff5f7;
        border-radius: 10px;
        display: none;
        margin: auto;
        padding: 20px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        font-size: 24px;
        color: #d14f6c;
        position: relative;
        transition: transform 0.5s;
    }

    .buttons {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .buttons button {
        padding: 10px 25px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.3s;
    }

    .yes {
        background-color: #ff7f9c;
        color: white;
    }

    .no {
        background-color: #f0a6c2;
        color: white;
    }

</style>
</head>
<body>

<div class="container">
    <div class="envelope-text">
        💌 This is for Maha ❤️ from Hadi 🌹
    </div>
    <div class="envelope" id="envelope"></div>

    <div class="letter" id="letter">
        Will you be my Valentine?
        <div class="buttons">
            <button class="yes" id="yesBtn">Yes</button>
            <button class="no" id="noBtn">No</button>
        </div>
    </div>
</div>

<script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    // Envelope click → show letter
    envelope.addEventListener('click', () => {
        envelope.style.transform = 'scale(0)';
        setTimeout(() => {
            envelope.style.display = 'none';
            letter.style.display = 'block';
            letter.style.transform = 'scale(0)';
            setTimeout(() => letter.style.transform = 'scale(1)', 50);
        }, 500);
    });

    // Yes button click → grows bigger
    yesBtn.addEventListener('click', () => {
        yesBtn.style.transform = 'scale(2)';
        noBtn.style.transform = 'scale(0)';
        setTimeout(() => alert("YYAAAY I love you ❤️🌹"), 500);
    });

    // No button click → shrinks smaller
    noBtn.addEventListener('click', () => {
        noBtn.style.transform = 'scale(0.2)';
        yesBtn.style.transform = 'scale(1)';
    });

    // Floating hearts
    for (let i = 0; i < 30; i++) {
        let heart = document.createElement('div');
        heart.classList.add('heart');
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (4 + Math.random() * 6) + 's';
        let size = 10 + Math.random() * 20;
        heart.style.width = size + 'px';
        heart.style.height = size + 'px';
        heart.style.backgroundColor = `hsl(${Math.random()*360}, 70%, 85%)`;
        heart.style.opacity = Math.random() * 0.7 + 0.3;
        document.body.appendChild(heart);
    }
</script>

</body>
</html>
