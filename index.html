<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine Surprise</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background-color: #ffeef4;
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffb6c1' fill-opacity='0.4'%3E%3Cpath d='M60 30 C65 15, 90 15, 90 40 C90 60, 60 80, 60 80 C60 80, 30 60, 30 40 C30 15, 55 15, 60 30 Z'/%3E%3C/g%3E%3C/svg%3E");
    background-size: 180px 180px;
  }

  .container {
    text-align: center;
  }

  /* Envelope */
  .envelope {
    width: 260px;
    height: 180px;
    background: #ffd6e8;
    position: relative;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s ease;
  }

  .envelope:hover {
    transform: scale(1.05);
  }

  .flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-top: 90px solid #ffc2dc;
    border-radius: 12px;
  }

  /* Letter */
  .letter {
    position: absolute;
    width: 220px;
    height: 150px;
    background: #fff0f6;
    border-radius: 10px;
    top: 15px;
    left: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transform: translateY(60px);
    transition: transform 0.6s ease;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    padding: 15px;
  }

  .letter.open {
    transform: translateY(-120px);
  }

  .question {
    font-size: 20px;
    color: #d63384;
    margin-bottom: 20px;
    text-align: center;
    font-weight: bold;
  }

  .buttons {
    display: flex;
    gap: 15px;
  }

  button {
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 16px;
    transition: transform 0.2s ease;
  }

  #yesBtn {
    background: #b8f2e6;
    color: #065f46;
  }

  #noBtn {
    background: #ffc2d1;
    color: #7a1c3a;
  }

</style>
</head>

<body>

<div class="container">
  <div class="envelope" onclick="openLetter()">
    <div class="flap"></div>
    <div class="letter" id="letter">
      <div class="question">Will you be my Valentine? 💌</div>
      <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
      </div>
    </div>
  </div>
</div>

<script>
  let yesScale = 1;
  let noScale = 1;

  function openLetter() {
    document.getElementById('letter').classList.add('open');
  }

  document.getElementById('noBtn').addEventListener('click', () => {
    noScale -= 0.15;
    yesScale += 0.2;

    if (noScale < 0.4) noScale = 0.4;

    document.getElementById('noBtn').style.transform = `scale(${noScale})`;
    document.getElementById('yesBtn').style.transform = `scale(${yesScale})`;
  });

  document.getElementById('yesBtn').addEventListener('click', () => {
    alert('Yayyyy 💖');
  });
</script>

</body>
</html>
